# Cobertura no Codecov (https://about.codecov.io). Segredo do GitHub: CODECOV_TOKEN.
# Começa só informativo: a cobertura aparece no PR, mas não bloqueia o merge.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
flags:
  unitarios:
    paths: [lib/, app/api/]
    carryforward: true
  integracao:
    paths: [lib/, app/api/]
    carryforward: true
comment:
  layout: 'diff, flags, files'
  require_changes: true
