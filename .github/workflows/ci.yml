# Verificações automáticas de cada Pull Request (e da branch padrão após o merge).
# Nada aqui altera o banco de produção nem publica o site: a Vercel cuida do deploy.
# Detalhes: docs/QUALIDADE.md e docs/TESTES.md.
name: CI

on:
  pull_request:
  push:
    branches: [claude/alcinao-sistema-pedidos, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  qualidade:
    name: Qualidade (Biome, ESLint, TypeScript, Knip, Arch-Contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome (formatação e lint)
        run: npx biome ci . --reporter=github
      - name: ESLint (regras do Next.js e React)
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Knip (arquivos, exports e dependências sem uso)
        run: npm run knip
      - name: Arch-Contract (contrato de arquitetura)
        run: npx arch-contract check --format github

  commits:
    name: Mensagens de commit (Commitlint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir os commits do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  unitarios:
    name: Testes unitários + cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Enviar cobertura ao Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unitarios
          fail_ci_if_error: false

  integracao-e2e:
    name: Integração (banco) + ponta a ponta (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Mesmo ambiente local de docs/TESTES.md: PostgreSQL + Supabase Auth + PostgREST.
      POSTGREST_BIN: ${{ github.workspace }}/.svc/postgrest
      GOTRUE_BIN: ${{ github.workspace }}/.svc/auth/auth
      GOTRUE_MIGRATIONS: ${{ github.workspace }}/.svc/auth/migrations
      POSTGREST_IMAGE: postgrest/postgrest:v12.2.12
      AUTH_IMAGE: supabase/gotrue:v2.177.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Binários do PostgREST e do Supabase Auth (copiados das imagens oficiais)
        run: |
          set -euo pipefail
          mkdir -p .svc/auth .svc/tmp-auth
          docker create --name pgrst "$POSTGREST_IMAGE" >/dev/null
          docker cp pgrst:/bin/postgrest .svc/postgrest
          docker create --name gotrue "$AUTH_IMAGE" >/dev/null
          docker cp gotrue:/usr/local/. .svc/tmp-auth/
          bin=$(find .svc/tmp-auth -type f \( -name auth -o -name gotrue \) -perm -u+x | head -1)
          mig=$(find .svc/tmp-auth -type d -name migrations | head -1)
          test -n "$bin" && test -n "$mig"
          cp "$bin" .svc/auth/auth
          cp -r "$mig" .svc/auth/migrations
          chmod +x .svc/postgrest .svc/auth/auth
          .svc/postgrest --version

      - name: Subir o Supabase local
        run: |
          set -euo pipefail
          bash scripts/local-supabase/start.sh
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(node scripts/local-supabase/keys.mjs anon)"
            echo "SUPABASE_SECRET_KEY=$(node scripts/local-supabase/keys.mjs service)"
            echo "ORDER_ACCESS_SECRET=segredo-local-de-testes-com-mais-de-32-caracteres"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100"
          } > .env.local

      - name: Testes de integração (banco, RLS, pedidos, relatórios)
        run: npx vitest run tests/db --coverage --coverage.reportsDirectory=coverage-db

      - name: Enviar cobertura de integração ao Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-db/lcov.info
          flags: integracao
          fail_ci_if_error: false

      - name: Banco no estado inicial e build de produção
        run: |
          bash scripts/local-supabase/apply-migrations.sh
          npm run build

      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes ponta a ponta (Playwright)
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .local-supabase/*.log
          retention-days: 7
